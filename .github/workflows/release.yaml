name: Release SDK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.ref_name == 'main' }}
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          release-type: go
